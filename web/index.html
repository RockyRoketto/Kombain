<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.png?v=__VER__">
<title data-i18n="app.name"></title>
<script>
// тема ставится раньше первой отрисовки, поэтому страница не мигает другой темой; выбор подставляет сервер
let themePref = '__THEME__';   // dark, light или system
const sysLight = matchMedia('(prefers-color-scheme: light)');
function applyTheme() {
  const t = themePref === 'system' ? (sysLight.matches ? 'light' : 'dark') : themePref;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=color-scheme]').content = t;
}
applyTheme();
sysLight.addEventListener('change', applyTheme);
</script>
<style>
__CSS__
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="hero-title">
      <h1 data-i18n="app.h1"></h1>
      <div class="by"><span id="appVer"></span>by Dmitrii Trudnikov</div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-t="conv" data-i18n="tab.conv"></button>
      <button class="tab" data-t="play" data-i18n="tab.play"></button>
      <button class="tab" data-t="mont" data-i18n="tab.mont"></button>
      <button class="tab" data-t="banner" data-i18n="tab.banner"></button>
      <button class="tab" data-t="util" data-i18n="tab.util"></button>
    </nav>
    <div class="hero-right">
      <button class="instb hide" id="installBtn" data-i18n-title="install.title" data-i18n="install.btn"></button>
      <button class="gear" id="gearBtn" data-i18n-title="settings" data-i18n-aria="settings" aria-expanded="false" aria-controls="setPanel">

          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.8H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.9-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
    </div>

    <!-- панель настроек: слева разделы, справа страница раздела. Новый раздел — кнопка в .setp-nav и .setp-page с тем же data-p -->
    <div class="setp hide" id="setPanel" role="dialog" data-i18n-aria="settings">
      <nav class="setp-nav" id="setpNav" role="tablist">
        <button class="setp-tab" role="tab" data-p="look"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg><span data-i18n="setp.look"></span></button>
        <button class="setp-tab" role="tab" data-p="conv"><svg viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg><span data-i18n="setp.conv"></span></button>
        <button class="setp-tab" role="tab" data-p="sounds"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></svg><span data-i18n="setp.sounds"></span></button>
        <button class="setp-tab" role="tab" data-p="store"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/></svg><span data-i18n="setp.store"></span></button>
        <button class="setp-tab" role="tab" data-p="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg><span data-i18n="setp.about"></span></button>
        <!-- в своём окне программу закрывает крестик, эта кнопка только для браузера -->
        <button class="btn sm setp-exit" id="exitBtn" data-i18n-title="exit.btn" data-i18n="exit.btn"></button>
      </nav>
      <div class="setp-body">
        <section class="setp-page" data-p="look" role="tabpanel">
          <h2 data-i18n="setp.theme"></h2>
          <div class="seg seg3" id="themeSeg">
            <button class="segb" data-v="dark"><b data-i18n="theme.dark"></b></button>
            <button class="segb" data-v="light"><b data-i18n="theme.light"></b></button>
            <button class="segb" data-v="system" data-i18n-title="theme.systemTitle"><b data-i18n="theme.system"></b></button>
          </div>
          <h2 data-i18n="setp.lang"></h2>
          <!-- названия языков не переводятся: каждый записан на своём языке -->
          <div class="seg seg2" id="langSeg">
            <button class="segb" data-v="ru" lang="ru"><b>Русский</b></button>
            <button class="segb" data-v="en" lang="en"><b>English</b></button>
          </div>
        </section>
        <section class="setp-page" data-p="conv" role="tabpanel">
          <h2 data-i18n="setp.conv"></h2>
          <div class="field">
            <div><span class="lb" data-i18n="setp.jobs"></span><span class="hint" data-i18n="setp.jobsHint"></span></div>
            <select id="jobs"><option>1</option><option>2</option><option>3</option><option>4</option></select>
          </div>
          <details class="setp-adv" id="extraBox">
            <summary data-i18n="setp.adv"></summary>
            <div class="stack">
              <span class="lb" data-i18n="setp.extra"></span>
              <input type="text" id="extra" data-i18n-ph="setp.extraPh">
              <div class="note" data-i18n="setp.extraHint"></div>
            </div>
          </details>
        </section>
        <section class="setp-page" data-p="sounds" role="tabpanel">
          <h2 data-i18n="setp.sounds"></h2>
          <div class="field">
            <span class="lb" data-i18n="sound.done"></span>
            <div class="soundc">
              <select id="soundDone" data-i18n-aria="sound.done"></select>
              <button class="btn sm" id="soundDoneTest" data-i18n-title="sound.test" data-i18n-aria="sound.test">▶</button>
            </div>
          </div>
          <div class="field">
            <span class="lb" data-i18n="sound.error"></span>
            <div class="soundc">
              <select id="soundError" data-i18n-aria="sound.error"></select>
              <button class="btn sm" id="soundErrorTest" data-i18n-title="sound.test" data-i18n-aria="sound.test">▶</button>
            </div>
          </div>
          <div class="note" data-i18n="sound.note"></div>
        </section>
        <!-- части полосы и строки рисует storeRender в settings.js -->
        <section class="setp-page" data-p="store" role="tabpanel">
          <h2 data-i18n="setp.store"></h2>
          <div class="st-total"><b id="stTotal">…</b><span data-i18n="store.total"></span></div>
          <div class="st-bar" id="stBar"></div>
          <ul class="st-legend" id="stLegend"></ul>
          <h2 data-i18n="store.cache"></h2>
          <div class="st-row">
            <div><span class="lb" id="stCache"></span><span class="hint" data-i18n="store.cacheHint"></span></div>
            <button class="btn sm" id="stClear" data-i18n="store.clear"></button>
          </div>
          <h2 data-i18n="store.speech"></h2>
          <div id="stModels"></div>
          <div class="setp-btns">
            <button class="btn sm" id="openData" data-i18n="setp.openData" data-i18n-title="setp.openDataTitle"></button>
          </div>
        </section>
        <section class="setp-page" data-p="about" role="tabpanel">
          <h2 data-i18n="about.versions"></h2>
          <div class="st-row"><div><span class="lb">Kombain <b id="abApp"></b></span><span class="hint" id="abAppNote"></span></div><button class="btn sm hide" id="abAppGo" data-i18n="btn.update"></button></div>
          <div class="st-row"><div><span class="lb">ffmpeg <b id="abFF"></b></span><span class="hint" id="abFFNote"></span></div><button class="btn sm hide" id="abFFGo" data-i18n="btn.update"></button></div>
          <h2 data-i18n="about.stats"></h2>
          <div class="ab-tiles">
            <div class="ab-tile"><b id="abFiles">0</b><span data-i18n="about.files"></span></div>
            <div class="ab-tile"><b id="abSaved">0</b><span data-i18n="about.saved"></span></div>
          </div>
          <div class="note" id="abSince"></div>
          <h2 data-i18n="setp.app"></h2>
          <div class="setp-btns">
            <button class="btn sm" id="resetAll" data-i18n="setp.reset"></button>
          </div>
        </section>
      </div>
    </div>
  </div>
</header>

          <button class="ctl-b" id="plMute" data-i18n-title="player.mute" data-i18n-aria="player.mute"><svg viewBox="0 0 24 24" class="line"><path class="solid" d="M4 9v6h4l5 5V4L8 9H4z"/><path class="i-on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="i-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
          <input type="range" class="vol" id="plVol" data-origin=".8" min="0" max="1" step="0.01" data-i18n-aria="player.volume">
        </div>
        <div class="pmeta" id="plMeta"></div>
      </div>
    </section>

    <section class="card pl-side">
      <div class="drop-head">
        <button class="btn sm" id="plAddFiles" data-i18n="add.files"></button>
        <button class="btn sm" id="plAddFolder" data-i18n="add.folder"></button>
        <button class="btn sm" id="plClear" data-i18n="btn.clear"></button>
        <span class="cnt" id="plCnt"></span>
      </div>
      <div class="note" id="plHint" data-i18n="pl.queueHint"></div>
      <div class="list" id="plList"></div>
    </section>
  </div>

  <!-- вкладка «Монтаж» -->
  <div class="main hide" id="montView">
    <section class="drop mt-files" id="mtDrop">
      <div class="drop-head">
        <button class="ctl-b" id="mtAddFiles" data-i18n-title="add.files" data-i18n-aria="add.files"><svg viewBox="0 0 24 24" class="line"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9zM13 3v6h6M12 12v6M9 15h6"/></svg></button>
        <button class="ctl-b" id="mtAddFolder" data-i18n-title="add.folder" data-i18n-aria="add.folder"><svg viewBox="0 0 24 24" class="line"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10.5v5M9.5 13h5"/></svg></button>
        <button class="ctl-b" id="mtClear" data-i18n-title="btn.clear" data-i18n-aria="btn.clear"><svg viewBox="0 0 24 24" class="line"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button>
        <button class="ctl-b" id="mtAllIn" data-i18n-title="mt.allIn" data-i18n-aria="mt.allIn"><svg viewBox="0 0 24 24" class="line"><path d="M12 3v9M8 8.5l4 4 4-4M3 16h18v5H3z"/></svg></button>
        <span class="cnt" id="mtCnt"></span>
      </div>
      <div class="empty" id="mtEmpty">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

        </svg>
        <b data-i18n="mt.dropTitle"></b>
        <span data-i18n="mt.dropSub"></span>
      </div>
      <div class="list hide" id="mtList"></div>
    </section>

    <section class="card mt-view">
      <div class="stage" id="mtStage">
        <div class="mv-canvas" id="mvCanvas"><div class="mv-grid hide" id="mvGrid"><i></i><i></i><i></i><i></i></div><div class="mv-safe hide" id="mvSafe"><i></i><i></i><u></u><u></u><b class="mv-zone" id="mvSafeZone"><span id="mvSafeName"></span><s id="mvSafeCut"></s></b></div><div class="mv-subs hide" id="mvSubs" dir="auto"><i data-sc="nw"></i><i data-sc="ne"></i><i data-sc="sw"></i><i data-sc="se"></i><i data-sc="n"></i><i data-sc="s"></i><i data-sc="w"></i><i data-sc="e"></i></div></div>
        <img id="mtImg" class="hide" alt="">
        <video id="mtVideo" class="hide" preload="auto" playsinline></video>
        <svg class="mv-draw" id="mvDraw"></svg>
        <div class="mv-frame hide" id="mvFrame" data-i18n-title="mv.frameTip"><i data-c="nw"></i><i data-c="ne"></i><i data-c="sw"></i><i data-c="se"></i><i data-c="n"></i><i data-c="e"></i><i data-c="s"></i><i data-c="w"></i><i data-c="rot" data-i18n-title="mv.rotTip"></i></div>

        <div class="mv-guide x hide" id="mvGuideX"></div>
        <div class="mv-guide y hide" id="mvGuideY"></div>
        <div class="mv-glines hide" id="mvGuideLines"></div>
        <canvas class="mv-ruler rx hide" id="mvRulerX"></canvas>
        <canvas class="mv-ruler ry hide" id="mvRulerY"></canvas>
        <button class="mv-rcorner hide" id="mvRulerCorner" data-i18n-title="mv.guidesClear" data-i18n-aria="mv.guidesClear">✕</button>
        <div class="mv-tag hide" id="mvTag"><span id="mvTagName"></span><button class="tk-mini" id="mvTagOff" data-i18n-title="mv.backToEdit" data-i18n-aria="mv.backToEdit">✕</button></div>
        <button class="mv-offarrow hide" id="mvOffArrow" data-i18n-title="mv.offTip" data-i18n-aria="mv.showLayer"><svg viewBox="0 0 24 24"><path d="M5 12h12M12 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="stage-note hide" id="mtNote"></div>
        <span class="bigplay" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
      </div>

      <div class="ctl off" id="mtCtl">
        <span class="ctl-t"><b id="mtNow">0:00:00</b></span>

        <button class="ctl-b" id="mtEnd" data-i18n-title="mt.toEnd" data-i18n-aria="mt.toEnd"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
